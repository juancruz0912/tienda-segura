name: pipeline

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep
      - run: semgrep scan --config p/javascript --error
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy config
        run: docker run --rm -v "$PWD":/src aquasec/trivy:0.58.1 config --exit-code 1 --severity HIGH,CRITICAL /src

  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Iniciar aplicacion
        run: |
          nohup node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS "http://localhost:3000/total?p=100&c=2" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
      - name: Detener aplicacion
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
